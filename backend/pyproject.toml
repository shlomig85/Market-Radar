[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketradar"
version = "0.1.0"
description = "Market Radar — emerging-theme investment intelligence platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "typer>=0.12",
    "httpx>=0.27",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
marketradar = "marketradar.cli:app"

[tool.setuptools.packages.find]
include = ["marketradar*"]

[tool.setuptools.package-data]
marketradar = ["demo/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a live PostgreSQL database",
    "e2e: full vertical-slice pipeline run",
]
filterwarnings = ["error::DeprecationWarning:marketradar.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
# Depends() in an argument default is FastAPI's documented idiom, not a mutable default.
"marketradar/api/app.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
plugins = []
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
