# Market Radar — full local stack.
#
#   docker compose up --build
#   → http://localhost:3000
#
# Bring-up order is enforced with health and completion conditions, so the web UI is only
# reachable once the database is migrated, the demo universe is seeded, and the pipeline and
# research loop have actually produced a theme and a report. You never see an empty app.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marketradar
      POSTGRES_PASSWORD: marketradar
      POSTGRES_DB: marketradar
    ports:
      # Overridable: a second checkout of this repo would otherwise fail to start with
      # "port is already allocated" against a stack that is already running.
      - "${MARKETRADAR_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - marketradar-pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketradar -d marketradar"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: migrate, seed the fictional DEMO universe, run the pipeline, run research.
  # Every step is idempotent, so re-running `docker compose up` is safe.
  bootstrap:
    build:
      context: ./backend
    environment:
      MARKETRADAR_DATABASE_URL: postgresql+psycopg://marketradar:marketradar@postgres:5432/marketradar
      MARKETRADAR_LOG_FORMAT: console
      MARKETRADAR_LOG_LEVEL: WARNING
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    command:
      - /bin/sh
      - -c
      - |
        set -e
        # Compose reports only "exit 1" for a failed one-shot service, which sends you
        # hunting through logs to find out which of four steps died. Name it on the way out.
        # Doubling the sigil escapes compose interpolation, so the shell sees the variable.
        step="starting up"
        trap 'echo "bootstrap FAILED during: $$step" >&2' EXIT
        step="applying migrations (alembic upgrade head)"
        echo "-> $$step"
        alembic upgrade head
        step="seeding the synthetic DEMO universe"
        echo "-> $$step (fictional issuers only)"
        python -m marketradar.cli seed
        step="running the pipeline (evidence -> events -> signals -> trends -> themes)"
        echo "-> $$step"
        python -m marketradar.cli pipeline
        step="running the research loop (plan -> search -> findings -> report)"
        echo "-> $$step"
        python -m marketradar.cli research ai-memory-demand
        trap - EXIT
        echo "-> ready"

  api:
    build:
      context: ./backend
    environment:
      MARKETRADAR_DATABASE_URL: postgresql+psycopg://marketradar:marketradar@postgres:5432/marketradar
      MARKETRADAR_CORS_ORIGINS: http://localhost:3000
      MARKETRADAR_LOG_LEVEL: INFO
    ports:
      - "${MARKETRADAR_API_HOST_PORT:-8000}:8000"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 20

  # One-off CLI commands. Identical to `api` but depends on the DATABASE only, never on
  # bootstrap: running `marketradar graph` should not require the whole demo bring-up to
  # have succeeded first, and a failure in the demo seed should not block an operator from
  # inspecting or repairing the database. Use:
  #
  #   docker compose --profile cli run --rm cli python -m marketradar.cli graph
  #
  # It publishes no host ports, so it also cannot collide with another stack.
  cli:
    build:
      context: ./backend
    environment:
      MARKETRADAR_DATABASE_URL: postgresql+psycopg://marketradar:marketradar@postgres:5432/marketradar
      MARKETRADAR_LOG_FORMAT: console
      MARKETRADAR_LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["cli"]
    entrypoint: []
    command: ["python", "-m", "marketradar.cli", "--help"]
    volumes:
      # The source is mounted over the copy baked into the image, so `git pull` alone is
      # enough to run new code — no rebuild for an operator command. The package is
      # installed with `pip install -e .`, so /app/marketradar IS the import path.
      #
      # Consequence worth knowing: `cli` then runs the working tree while `api` and
      # `bootstrap` run the built image, so they can differ. That is the right way round —
      # `up` stays reproducible, and the debugging tool always shows you current code — but
      # a dependency change in pyproject.toml still needs `docker compose build`.
      - ./backend/marketradar:/app/marketradar:ro
      - ./backend/alembic:/app/alembic:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro

  web:
    build:
      context: ./frontend
    environment:
      # Server-side fetch across the compose network; the browser only ever talks to :3000.
      MARKETRADAR_API_URL: http://api:8000
    ports:
      - "${MARKETRADAR_WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  marketradar-pgdata:
